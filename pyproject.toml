[project]
name = "cot-control-ft"
version = "0.1.0"
description = "Replication of METR's CoT-controllability fine-tuning experiment on Qwen3.5-9B (own pipeline)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "matplotlib",
    "pyyaml",
    "tqdm",
    "httpx",
    "openai>=1.50",
    "fast-langdetect",
    "python-dotenv",
]

[project.optional-dependencies]
# GPU host (skynet 3) only. vLLM nightly + transformers main are installed separately, see README.
gpu = [
    "torch",
    "wandb",
    "transformers",
    "peft",
    "accelerate",
    "datasets",
]
dev = [
    "pytest",
    "nltk",
    "immutabledict",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cotctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
