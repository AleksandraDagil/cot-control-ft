# Baseline evaluation of the unmodified model. Every run copies its config into results/.
model:
  # Served model id; must match what `scripts/serve_vllm.sh` advertises on /v1/models.
  name: Qwen/Qwen3.5-9B
  served_name: Qwen/Qwen3.5-9B
  adapter: null              # LoRA adapter name for post-FT evals (P4)

server:
  base_url: http://localhost:8000/v1
  max_model_len: 24576
  concurrency: 64

sampling:
  # METR: temperature 1.0, max_tokens 16384, no system prompt.
  # top_p/top_k are Qwen's thinking-mode defaults; presence_penalty deliberately unset.
  #
  # DEVIATION from METR: max_tokens raised 16384 -> 32768, measured on both suites.
  #
  # ReasonIF calibration at 16384: 33 % of rollouts truncated mid-<think> (aime 85 %, amc 55 %,
  # gpqa 36 %). CoTControl probe at 16384 (54 rollouts, 6 questions x 9 modes): 15 % would have
  # truncated, and it is concentrated entirely in one dataset --
  #     cotcontrol/gpqa      median 13153 tok, 8/18 over 16384  (44 %)
  #     cotcontrol/hle       median  6991 tok, 0/18 over 16384
  #     cotcontrol/mmlu_pro  median  7018 tok, 0/18 over 16384
  # GPQA is 110 of our 300-question draw, so a 16384 cap would silently drop ~16 % of CoTControl
  # rollouts, non-randomly: the long-reasoning ones. Truncated rollouts are ungradeable and leave
  # every compliance rate, so the cap was deciding which questions counted. METR's own models
  # reason far more concisely, so 16384 did not bind for them the way it does here.
  #
  # 32768 does not fully fix it -- 3/54 CoTControl rollouts still truncate, and aime's ReasonIF
  # p20 may remain censored. Report the truncation rate with every result and flag the deviation.
  temperature: 1.0
  max_tokens: 32768
  top_p: 0.95
  top_k: 20
  seed: null

eval:
  reasonif:
    n: 300                   # full suite
  cotcontrol:
    n_per_mode: 300          # 300 questions x 9 modes = 2700 rollouts (3x METR, for per-mode power)
    seed: 42                 # proportional_sample draw over the 1214-row pool
    modes: null              # null = all 9
  # Per-source word budgets for the number_words instruction, produced by
  # scripts/calibrate_number_words.py. null = use the values shipped in the dataset.
  word_limits: null

judge:
  model: openai/gpt-5-mini   # via OpenRouter; upstream + METR use gpt-5-mini
  concurrency: 16
  meta_discussion_llm: false # default is METR's regex heuristic
