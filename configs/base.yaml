# Baseline evaluation of the unmodified model. Every run copies its config into results/.
model:
  # Served model id; must match what `scripts/serve_vllm.sh` advertises on /v1/models.
  name: Qwen/Qwen3.5-9B
  served_name: Qwen/Qwen3.5-9B
  adapter: null              # LoRA adapter name for post-FT evals (P4)

server:
  base_url: http://localhost:8000/v1
  max_model_len: 24576
  concurrency: 64

sampling:
  # METR: temperature 1.0, max_tokens 16384, no system prompt.
  # top_p/top_k are Qwen's thinking-mode defaults; presence_penalty deliberately unset.
  temperature: 1.0
  max_tokens: 16384
  top_p: 0.95
  top_k: 20
  seed: null

eval:
  reasonif:
    n: 300                   # full suite
  cotcontrol:
    n_per_mode: 300          # 300 questions x 9 modes = 2700 rollouts (3x METR, for per-mode power)
    seed: 42                 # proportional_sample draw over the 1214-row pool
    modes: null              # null = all 9
  # Per-source word budgets for the number_words instruction, produced by
  # scripts/calibrate_number_words.py. null = use the values shipped in the dataset.
  word_limits: null

judge:
  model: openai/gpt-5-mini   # via OpenRouter; upstream + METR use gpt-5-mini
  concurrency: 16
  meta_discussion_llm: false # default is METR's regex heuristic
